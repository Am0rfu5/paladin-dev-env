codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach,diff,flags,files"

ignore:
  - "src/bin/**"
  - "tests/**"
  - "benches/**"
  - "examples/**"
  - "migrations/**"
  - "scripts/**"
  - "flat/**"
