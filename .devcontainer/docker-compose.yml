version: '3.8'

services:
  # Main development container
  paladin-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      - paladin-cargo-cache:/usr/local/cargo/registry
      - paladin-target-cache:/workspace/target
    command: /bin/sh -c "while sleep 1000; do :; done"
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=debug
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - redis
      - minio
      - mysql
    networks:
      - paladin-dev-network
    ports:
      - "8080:8080"
      - "9090:9090"

  # Redis for queue management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - paladin-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - paladin-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MySQL database
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paladin
      MYSQL_USER: paladin
      MYSQL_PASSWORD: paladinpass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - paladin-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  paladin-dev-network:
    driver: bridge

volumes:
  paladin-cargo-cache:
  paladin-target-cache:
  redis-data:
  minio-data:
  mysql-data:
