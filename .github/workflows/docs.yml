name: Docs

on:
  # Unlike the validation workflows, this one INTENTIONALLY keeps `push: [main]`:
  # the `deploy` job publishes to GitHub Pages and must run when docs land on
  # `main`. The `main` filter means it never double-runs on feature branches
  # (those only trigger the `pull_request` build, which does not deploy).
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "crates/doc-examples/**"
      - ".github/workflows/docs.yml"
  # NO `paths:` filter here, deliberately. `Build MDBook` is a REQUIRED status
  # check on `main` (see .github/rulesets/protect-main-branch.json). GitHub
  # blocks a pull request until every required context reports, and a
  # path-filtered workflow simply never reports on a PR that touches no matching
  # path — so a docs path filter here made every non-docs PR permanently
  # unmergeable. Observed on PR #31, which changed only `.planning/` files:
  # 97 checks complete, 0 pending, still BLOCKED. The build is ~1 minute, so
  # running it on every PR is far cheaper than the deadlock it removes.
  # `scripts/check-workflow-triggers.sh`'s reachability clause now fails CI if a
  # path filter is reintroduced on any workflow owning a pinned context.
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build MDBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          cargo install mdbook --version 0.4.40 --locked

      - name: Install mdbook-mermaid
        run: |
          cargo install mdbook-mermaid --version 0.13.0 --locked

      - name: Install mdbook-linkcheck
        run: |
          cargo install mdbook-linkcheck --version 0.7.7 --locked

      - name: Inject mermaid assets
        run: mdbook-mermaid install docs/

      - name: Build docs
        run: mdbook build docs/

      - name: Check doc code examples (compile paladin-doc-examples + scan inline blocks)
        run: ./scripts/check-doc-examples.sh

      - name: Check doc config snippets (YAML)
        run: |
          pip install --quiet pyyaml
          ./scripts/check-doc-config.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # With `[output.linkcheck]` enabled, mdbook emits a second backend, so
          # the rendered HTML site lives in `docs/book/html/` (not `docs/book/`,
          # which then only holds the `html/` and `linkcheck/` subdirectories).
          # Uploading `docs/book/` would serve a Pages root with no index.html
          # (404). Publish the HTML subdirectory.
          path: docs/book/html/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
