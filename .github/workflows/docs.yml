name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "crates/doc-examples/**"
  pull_request:
    paths:
      - "docs/**"
      - "crates/doc-examples/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build MDBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          cargo install mdbook --version 0.4.40 --locked

      - name: Install mdbook-mermaid
        run: |
          cargo install mdbook-mermaid --version 0.13.0 --locked

      - name: Inject mermaid assets
        run: mdbook-mermaid install docs/

      - name: Build docs
        run: mdbook build docs/

      - name: Check doc code examples (compile paladin-doc-examples + scan inline blocks)
        run: ./scripts/check-doc-examples.sh

      - name: Check doc config snippets (YAML)
        run: |
          pip install --quiet pyyaml
          ./scripts/check-doc-config.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
