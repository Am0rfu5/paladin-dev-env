name: pre-commit

# Runs the version-controlled pre-commit hook suite as a required CI gate so the
# same checks developers run locally are enforced for every contributor.
on:
  pull_request:
  # Also runs on pushes to the long-lived branches. Duplicate runs (one for
  # `push`, one for `pull_request`) are collapsed by the `concurrency` group
  # below rather than by dropping a trigger: a PR-only trigger means this gate
  # never runs at all on a branch that receives direct pushes and only opens a
  # PR at the very end, which is exactly how eight broken action references
  # survived two weeks unnoticed.
  push:
    branches:
      - main
      - develop
      - 'release/**'

permissions:
  contents: read

concurrency:
  # `head_ref` is set only on pull_request events (the source branch); on push
  # it is empty and this falls back to `ref`. That makes the push run and the
  # PR run for the same branch share one group, so the newer supersedes the
  # older instead of both burning a runner.
  group: pre-commit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-precommit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-precommit-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
