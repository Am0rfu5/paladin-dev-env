name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      dry_run:
        description: 'Dry run: validate publishing with `cargo publish --dry-run` and do not publish to crates.io'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Release-branch protection (Milestone 10 Epic 5): a release tag must point at
  # a commit that is contained in `main`. This is the authoritative enforcement
  # of the GitFlow "main is the source of truth" invariant — a tag cut from an
  # unmerged feature branch fails here before anything is published.
  verify-tag-source:
    name: Verify Tag From Main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The release commit SHA this job's own `resolve` step already
      # computes, exposed so the consistency gate can check CI's conclusion
      # for the exact release commit rather than re-deriving it.
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Resolve the dispatched tag name to its commit SHA. Force-fetch tags
            # so an annotated tag does not collide with a pre-existing lightweight
            # ref (`would clobber existing tag`).
            git fetch --tags --force --quiet origin
            # No `--` here: `$RELEASE_TAG` must resolve as a revision, not a
            # pathspec. `git rev-list -n 1 -- "$RELEASE_TAG"` places it after
            # `--`, which git treats as a pathspec; with no `<commit>` given,
            # rev-list prints its usage message and exits 129 on every
            # workflow_dispatch run. `set -euo pipefail` already fails this
            # step loudly (non-zero exit, no SHA assigned) when the tag does
            # not exist as a revision.
            SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          else
            # On a tag push the checked-out commit is already the release commit.
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit: $SHA"

      - name: Ensure release commit is contained in main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          SHA="${{ steps.resolve.outputs.sha }}"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "✅ Release commit $SHA is contained in origin/main."
          else
            echo "::error::Release tag points at commit $SHA, which is NOT contained in main. \
          Release tags must be cut from the main branch (merge via PR first). See \
          docs/src/appendix/branch-protection.md."
            exit 1
          fi

  # Full test suite — gates crates.io publishing (a release must not publish if
  # tests fail). Docker images (build-docker) and release binaries
  # (build-binaries) below are NOT gated on this job -- they depend only on
  # create-release, so a release with a failing test suite can still push a
  # tagged Docker image to ghcr.io and attach binaries to the GitHub release,
  # just not publish to crates.io. This asymmetry is a documented choice
  # (WR-05), not a latent surprise.
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: verify-tag-source
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --workspace

  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: verify-tag-source
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Extract changelog section (ARTIFACT-01, D-01/D-02/D-03): the release
      # body is the curated `## [X.Y.Z]` section from the root CHANGELOG.md,
      # not a commit-subject list -- this project maintains a hand-authored
      # Keep-a-Changelog corpus on purpose, and the previous step discarded
      # it (1,014 commit subjects for v0.8.0) while also advertising a
      # `docker pull` instruction naming the mutable "latest" tag this
      # workflow has never pushed on a tag ref. Neither the commit-log body
      # nor the mutable-tag pull block is replaced with a new static
      # template here -- the artifact sections arrive later from real job
      # outputs (plan 21-03/21-04, D-04).
      # A missing section is a hard, named failure with no fallback (D-01).
      - name: Extract changelog section
        id: changelog
        env:
          # Indirect through env: rather than interpolating the tainted
          # output directly into the run: block (CR-01) -- the version
          # ultimately traces back to the workflow_dispatch `tag` input.
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          ./scripts/extract-changelog-section.sh \
            --changelog CHANGELOG.md \
            --version "$RELEASE_VERSION" \
            --output "${RUNNER_TEMP}/release-body.md"

      # Create-or-reuse (D-01/D-02/PUBOPS-03): looks the release up by tag
      # first -- HTTP 200 reuses it, HTTP 404 creates it, anything else is a
      # hard failure -- so re-running this job on a tag that already has a
      # release (either GitHub Actions re-run shape) proceeds instead of
      # failing with a 422. No archived or third-party release-creation
      # Action is used; this shells out to the `gh` CLI already
      # authenticated on the runner via GITHUB_TOKEN (D-01 prohibits
      # introducing a new marketplace Action here). Every tag- and
      # SHA-derived value arrives through env: (CR-01) -- never interpolated
      # directly into this run: body -- and the release body is passed as a
      # file path, never as inline commit text.
      - name: Create or reuse release
        id: create_or_reuse_release
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_BODY_FILE: ${{ steps.changelog.outputs.section_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/create-or-reuse-release.sh \
            --tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --body-file "$RELEASE_BODY_FILE"

  # Build and push multi-arch Docker images. Intentionally not gated on the
  # `test` job (WR-05) -- see the comment on the `test` job for the tradeoff.
  build-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags_json: ${{ steps.meta.outputs.json }}
      image_size_mb: ${{ steps.size.outputs.image_size_mb }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        id: size
        env:
          # CR-01: route the tag-derived JSON blob through env: rather than
          # inlining `${{ steps.meta.outputs.json }}` into the run: body, matching
          # every other tainted value (tag, version, SHA, digest) in this file.
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Use the exact tag metadata-action produced. It already lowercases the
          # repository name (ghcr requires lowercase, but env.IMAGE_NAME keeps the
          # original `DF3NDR/...` casing) and strips the leading `v` from the
          # semver tag, so reconstructing the reference by hand is error-prone.
          IMAGE=$(echo "$META_JSON" | jq -r '.tags[0]')
          echo "Inspecting image: $IMAGE"
          docker pull "$IMAGE"
          SIZE=$(docker image inspect "$IMAGE" --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          # The 500 MB target is advisory (D-10): the measurement is reported
          # into the release body by the finalize job instead of a GitHub
          # warning annotation that let the run finish green while reporting
          # nothing a consumer would ever read.
          echo "image_size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "Image size: ${SIZE_MB} MB (advisory against the 500 MB target; reported in the release body)" >> "$GITHUB_STEP_SUMMARY"

  # Build binaries for multiple platforms. Intentionally not gated on the
  # `test` job (WR-05) -- see the comment on the `test` job for the tradeoff.
  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: paladin-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: paladin-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: paladin-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: paladin-macos-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cross-compilation targets are installed per-toolchain. Installing the
      # target against `stable` while rust-toolchain.toml pins cargo to an exact
      # version would leave the build without a std for the target, so the
      # target must attach to the pinned toolchain.
      #
      # dtolnay/rust-toolchain does NOT read rust-toolchain.toml -- a bare
      # `@master` with no `toolchain:` input fails with "'toolchain' is a
      # required input" before doing any work. Read the pinned channel out of
      # rust-toolchain.toml instead, so there is exactly one source of truth and
      # no fourth place to keep in lockstep.
      - name: Read pinned Rust channel
        id: rust_pin
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          if [ -z "$channel" ]; then
            echo "::error::could not read [toolchain].channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        # Pinned to a commit SHA rather than the mutable `@master` branch ref
        # (WR-02) -- this job holds contents: write. Still the `master` ref's
        # action code (not `@stable`/`@beta`/`@nightly`), which is required
        # for the `toolchain:` input mechanism the comment above depends on;
        # only the ref is pinned, not the toolchain-selection design.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, as of 2026-08-27
        with:
          toolchain: ${{ steps.rust_pin.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked --version 0.2.5

      # Every leg builds all three declared [[bin]] targets under an explicit
      # feature set (D-05) -- a bare `cargo build --release` silently skips
      # any binary whose `required-features` are unmet, so the release has
      # never actually attached `paladin-cli` or `paladin-server`. The
      # aarch64 branch composes `vendored-openssl` on top of the same
      # `cli,web-server` pair the other three legs use, since `cross`
      # containers lack a target-arch system OpenSSL.
      - name: Build binary
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }} --features cli,web-server,vendored-openssl
          else
            cargo build --release --target ${{ matrix.target }} --features cli,web-server
          fi

      # aarch64-cross-compiled binaries need the matching aarch64 strip from
      # binutils-aarch64-linux-gnu -- the host x86_64 `strip` cannot read
      # them ("Unable to recognise the format"). This install step stays its
      # own preceding conditional; the strip itself now runs inside the
      # packaging step below via --strip-cmd.
      - name: Install aarch64 strip toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      # Assert -> strip -> archive -> portable checksum, all in one script
      # (ARTIFACT-02, ARTIFACT-05): a leg that produced no executable fails
      # here, loudly, before anything is archived -- the old two-step
      # Strip/Create-archive pair assumed a single hardcoded `paladin`
      # binary was always present and had no such check. Values reach the
      # script through env: indirection (CR-01), never interpolated
      # directly into this run: body.
      - name: Package release binaries
        id: package
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARCHIVE_NAME: ${{ matrix.artifact_name }}
          STRIP_CMD: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-strip' || 'strip' }}
        run: |
          ./scripts/package-release-binaries.sh \
            --target "$BUILD_TARGET" \
            --release-dir "target/$BUILD_TARGET/release" \
            --archive-name "$ARCHIVE_NAME" \
            --strip-cmd "$STRIP_CMD"

      # Uploads through the `gh` CLI with the clobber flag (D-07, Phase 20
      # D-03) so a re-run replaces the same asset name instead of failing on
      # a duplicate. The release is resolved by tag, not by an upload-URL
      # job output -- create-release no longer exposes one (D-07). Both
      # files collapse into a single invocation rather than the old
      # two-step Upload-Release-Asset/Upload-SHA256 pair.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" "$CHECKSUM_PATH" --clobber --repo "$RELEASE_REPOSITORY"

  # Pre-publish consistency gate (PUBOPS-01): fails closed if the release
  # tag's version disagrees with any publishable crate's manifest version.
  # Runs the exact script `make check-release-consistency` runs locally --
  # no gate logic is duplicated in this YAML (D-07). Added to
  # `publish-crates`'s `needs` below so no `cargo publish` can start before
  # this job has passed. Deliberately NOT added to `create-release`,
  # `build-docker`, `build-binaries` or `sbom` -- WR-05's documented
  # asymmetry (a release with a failing gate can still produce a GitHub
  # release, Docker image, binaries and SBOM; it just cannot publish to
  # crates.io) is preserved deliberately, not by oversight.
  #
  # This job satisfies D-03 by construction: it only reads (cargo metadata
  # over the checked-out tree) and writes nothing, keeping no state between
  # runs. Both "Re-run failed jobs" and "Re-run all jobs" therefore
  # re-evaluate it from scratch and reach the same verdict on the same tag.
  # A future change that introduces caching or a state file here would be a
  # regression against that property.
  check-release-consistency:
    name: Pre-Publish Consistency Gate
    runs-on: ubuntu-latest
    needs: verify-tag-source
    permissions:
      contents: read
      # The CI-conclusion clause queries the Actions workflow-runs API for the
      # tagged SHA; without this the GITHUB_TOKEN gets HTTP 404 (GitHub masks
      # missing scope as not-found) and the gate fails closed with
      # CI_LOOKUP_FAILED. Found live on the v0.8.1-rc.4 rehearsal run
      # (Phase 20, 20-07 finding 5).
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Get version
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pre-publish consistency gate
        env:
          # Indirect through env: rather than interpolating the tainted
          # output directly into the run: block (CR-01) -- the version
          # ultimately traces back to the workflow_dispatch `tag` input.
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
          # The exact release commit SHA verify-tag-source already
          # resolved, so a later clause can check CI's conclusion for the
          # precise release commit rather than re-deriving it.
          RELEASE_SHA: ${{ needs.verify-tag-source.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-release-consistency.sh --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

  # Generate a CycloneDX Software Bill of Materials (SBOM) from the locked
  # dependency graph and attach it to the GitHub release (Milestone 10 Epic 2).
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    env:
      # Indirect through env: rather than interpolating the tainted output
      # directly into run:/with: blocks (CR-01) -- the version ultimately
      # traces back to the workflow_dispatch `tag` input.
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        # cargo-cyclonedx writes one `<crate>.cdx.json` next to each crate's
        # manifest; the root workspace package (paladin-ai) is the primary
        # deliverable for the release.
        run: |
          cargo cyclonedx --all --format json
          # The root package SBOM is the primary deliverable.
          cp paladin-ai.cdx.json "paladin-${RELEASE_VERSION}.cdx.json"

      # Uploads through the `gh` CLI with the clobber flag (D-07, Phase 20
      # D-03) so a re-run replaces the same asset name instead of failing on
      # a duplicate. The release is resolved by tag, not by an upload-URL
      # job output -- create-release no longer exposes one (D-07).
      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SBOM_PATH: paladin-${{ env.RELEASE_VERSION }}.cdx.json
        run: |
          gh release upload "$RELEASE_VERSION" "$SBOM_PATH" --clobber --repo "$RELEASE_REPOSITORY"

  # Terminal job in the artifact-composition graph (D-04, ARTIFACT-03/-04/
  # -05): `create-release` publishes the curated CHANGELOG.md section alone;
  # this job binds the container image to that release by immutable digest,
  # reports the measured image size, aggregates a single checksum file over
  # every archive `build-binaries` actually uploaded, and states the
  # attached SBOM's real scope -- reading only real outputs the run
  # actually produced, never a hand-reconstructed guess. `if: always()`
  # is what lets this job still run when `build-docker`, `build-binaries` or
  # `sbom` failed or was skipped (their sections are then simply omitted --
  # see scripts/finalize-release-body.sh) -- it is guarded instead on
  # `needs.create-release.result == 'success'` so it never runs against a
  # release that was never created. Not added to `test`'s or any other
  # job's `needs` (WR-05's documented artifact/test asymmetry is preserved
  # deliberately here, not by oversight), and not gated on `test` itself.
  #
  # `build-docker`'s outputs are consumed as a single JSON blob
  # (`toJSON(needs.build-docker.outputs)`), never as individual
  # `needs.build-docker.outputs.<name>` expressions -- so this job never
  # re-declares a field-name literal a second time outside build-docker's
  # own `outputs:` block and `Verify image size` step (each of its three
  # declared fields already has exactly one authoritative declaration site
  # there). The ternary (`result == 'success' && … || '{}'`)
  # is what makes a failed or skipped `build-docker` leg contribute nothing,
  # so the finalize script omits the container-image and image-size
  # sections rather than advertising a leg that never ran. The SBOM asset
  # name is built the same way -- only supplied when `needs.sbom` actually
  # succeeded, matching `sbom`'s own attached filename exactly, so a failed
  # SBOM leg contributes no section either. Checksum aggregation needs no
  # equivalent gate: it downloads whatever `*.tar.gz` archives are actually
  # visible on the release at this point, so a failed `build-binaries` leg
  # simply means fewer (or zero) archives -- and zero is itself a handled,
  # non-failing outcome (see aggregate_checksums's own doc comment). No new
  # permission and no new marketplace Action: the checksum switch and the
  # SBOM asset name both reach the same script invocation `build-docker`'s
  # inputs already used, and the download/upload calls the switch makes are
  # the same `gh` CLI already authenticated on this job's `contents: write`.
  finalize-release-body:
    name: Finalize Release Body
    runs-on: ubuntu-latest
    needs: [create-release, build-docker, build-binaries, sbom]
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Finalize release body with artifact sections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
          DOCKER_OUTPUTS_JSON: ${{ needs.build-docker.result == 'success' && toJSON(needs.build-docker.outputs) || '{}' }}
          # The SBOM job's own upload step names its asset
          # `paladin-${RELEASE_VERSION}.cdx.json` -- built identically here
          # so the two never drift apart, and left empty when the SBOM leg
          # did not succeed so no section names a document that was never
          # attached.
          SBOM_ASSET_NAME: ${{ needs.sbom.result == 'success' && format('paladin-{0}.cdx.json', needs.create-release.outputs.version) || '' }}
        run: |
          set -euo pipefail
          IMAGE_DIGEST=$(echo "$DOCKER_OUTPUTS_JSON" | jq -r '.digest // empty')
          TAGS_JSON=$(echo "$DOCKER_OUTPUTS_JSON" | jq -r '.tags_json // empty')
          # By field name, not position: a positional `to_entries[N]` lookup
          # relies on toJSON(needs.build-docker.outputs) preserving field
          # order exactly matching build-docker's `outputs:` declaration --
          # not guaranteed by the JSON spec, and silently wrong (or empty) if
          # a future edit reorders or inserts a field there.
          IMAGE_SIZE_MB=$(echo "$DOCKER_OUTPUTS_JSON" | jq -r '.image_size_mb // empty')
          IMAGE_REF=""
          if [ -n "$TAGS_JSON" ] && [ "$TAGS_JSON" != "null" ]; then
            IMAGE_REF=$(echo "$TAGS_JSON" | jq -r '.tags[0] // empty')
          fi
          ./scripts/finalize-release-body.sh \
            --tag "$RELEASE_TAG" \
            --image-digest "$IMAGE_DIGEST" \
            --image-ref "$IMAGE_REF" \
            --image-size-mb "$IMAGE_SIZE_MB" \
            --aggregate-checksums \
            --sbom-asset "$SBOM_ASSET_NAME"

  # Publish workspace crates to crates.io in dependency order (Milestone 10
  # Epic 3), authenticating via crates.io Trusted Publishing (Phase 19). The
  # job mints a short-lived (~30 minute) publish token per run from its own
  # GitHub OIDC identity via `rust-lang/crates-io-auth-action@v1`; there is no
  # repository secret to be absent, and the action's own post step revokes the
  # token at job end. The job runs only under the `crates-io` GitHub
  # Environment, whose deployment policy admits exclusively `v*.*.*` tags —
  # that environment name is embedded in the OIDC subject claim crates.io
  # validates, so only a release tag from this repository can ever mint a
  # token. When the workflow is dispatched with `dry_run=true`, this runs
  # `cargo publish --dry-run` for each crate instead and mints no token at
  # all. Known accepted risk (T-19-13): a single mint must outlive the whole
  # eleven-crate sequential loop -- that has NOT changed in this revision.
  # What HAS changed (PUBOPS-03/PUBOPS-04, plan 20-05): the loop's waits
  # between crates are now bounded registry polls rather than fixed pauses,
  # and the loop now skips any crate the registry says is already at the
  # tagged version, so a recovery re-run over a partially-published tag is
  # materially shorter than a first run -- it only mints a token for, and
  # publishes, the crates still missing. `publish-crates` also now needs
  # `check-release-consistency` (PUBOPS-01's gate), so no publish can start
  # before the tag, every manifest version, every changelog and the tagged
  # commit's recorded CI conclusion have all been checked to agree. All
  # publish logic (the eleven-crate order, the registry pre-check, the
  # index-visibility poll, the per-crate outcome table, and the
  # no-crate-moved failure) lives in `scripts/publish-crates.sh`, not here --
  # this job is a thin invocation, locally reproducible and unit-tested
  # (`tests/scripts/publish-crates_test.sh`) without touching crates.io.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test, create-release, check-release-consistency]
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine publish mode
        id: mode
        env:
          # Indirect through env: rather than interpolating the dispatch
          # input directly into the run: block (CR-01) -- a workflow_dispatch
          # input is exactly the tainted-value class CR-01 covers.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry-run mode — will run 'cargo publish --dry-run' and NOT publish."
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        id: auth
        if: steps.mode.outputs.dry_run != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      # Delegates the whole loop -- registry pre-check (D-04), bounded
      # index-visibility poll (D-05), per-crate outcome table and the
      # no-crate-moved failure (D-12/PUBOPS-04) -- to
      # scripts/publish-crates.sh. The release version reaches the script
      # through env: (CR-01), never interpolated into this run: body; the
      # eleven-crate dependency order and its paladin-herald placement
      # comment now live once, in the script, not here.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          PUBLISH_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--version "$RELEASE_VERSION")
          if [ "$PUBLISH_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          ./scripts/publish-crates.sh "${ARGS[@]}"
