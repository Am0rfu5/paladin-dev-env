name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      dry_run:
        description: 'Dry run: validate publishing with `cargo publish --dry-run` and do not publish to crates.io'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Release-branch protection (Milestone 10 Epic 5): a release tag must point at
  # a commit that is contained in `main`. This is the authoritative enforcement
  # of the GitFlow "main is the source of truth" invariant — a tag cut from an
  # unmerged feature branch fails here before anything is published.
  verify-tag-source:
    name: Verify Tag From Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Resolve the dispatched tag name to its commit SHA. Force-fetch tags
            # so an annotated tag does not collide with a pre-existing lightweight
            # ref (`would clobber existing tag`).
            git fetch --tags --force --quiet origin
            SHA=$(git rev-list -n 1 "${{ inputs.tag }}")
          else
            # On a tag push the checked-out commit is already the release commit.
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit: $SHA"

      - name: Ensure release commit is contained in main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          SHA="${{ steps.resolve.outputs.sha }}"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "✅ Release commit $SHA is contained in origin/main."
          else
            echo "::error::Release tag points at commit $SHA, which is NOT contained in main. \
          Release tags must be cut from the main branch (merge via PR first). See \
          docs/BRANCH_PROTECTION.md."
            exit 1
          fi

  # Full test suite — gates crates.io publishing (a release must not publish if
  # tests fail).
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: verify-tag-source
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run test suite
        run: cargo test --workspace

  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: verify-tag-source
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from git commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Docker Images

            Multi-architecture Docker images are available:
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ```

            Supported platforms:
            - linux/amd64
            - linux/arm64
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}

  # Build and push multi-arch Docker images
  build-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        run: |
          # Use the exact tag metadata-action produced. It already lowercases the
          # repository name (ghcr requires lowercase, but env.IMAGE_NAME keeps the
          # original `DF3NDR/...` casing) and strips the leading `v` from the
          # semver tag, so reconstructing the reference by hand is error-prone.
          IMAGE=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[0]')
          echo "Inspecting image: $IMAGE"
          docker pull "$IMAGE"
          SIZE=$(docker image inspect "$IMAGE" --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ $SIZE_MB -gt 500 ]; then
            echo "::warning::Image size (${SIZE_MB} MB) exceeds 500 MB target"
          fi

  # Build binaries for multiple platforms
  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: paladin-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: paladin-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: paladin-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: paladin-macos-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cross-compilation targets are installed per-toolchain. Installing the
      # target against `stable` while rust-toolchain.toml pins cargo to an exact
      # version would leave the build without a std for the target, so let the
      # action read the pinned version (no `toolchain:` input) and attach the
      # target to that same toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build binary
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            # `cross` containers lack a target-arch system OpenSSL, so build a
            # vendored OpenSSL from source for this target only.
            cross build --release --target ${{ matrix.target }} --features vendored-openssl
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            # This binary is cross-compiled to aarch64 (via `cross`), so the host
            # x86_64 `strip` cannot read it ("Unable to recognise the format").
            # Use the matching aarch64 cross strip from binutils-aarch64-linux-gnu.
            sudo apt-get update
            sudo apt-get install -y binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/paladin
          else
            strip target/${{ matrix.target }}/release/paladin
          fi

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact_name }}.tar.gz paladin
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}.tar.gz
          asset_name: ${{ matrix.artifact_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload SHA256
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}.tar.gz.sha256
          asset_name: ${{ matrix.artifact_name }}.tar.gz.sha256
          asset_content_type: text/plain

  # Generate a CycloneDX Software Bill of Materials (SBOM) from the locked
  # dependency graph and attach it to the GitHub release (Milestone 10 Epic 2).
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        # cargo-cyclonedx writes one `<crate>.cdx.json` next to each crate's
        # manifest; the root workspace package (paladin-ai) is the primary
        # deliverable for the release.
        run: |
          cargo cyclonedx --all --format json
          # The root package SBOM is the primary deliverable.
          cp paladin-ai.cdx.json "paladin-${{ needs.create-release.outputs.version }}.cdx.json"

      - name: Upload SBOM to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: paladin-${{ needs.create-release.outputs.version }}.cdx.json
          asset_name: paladin-${{ needs.create-release.outputs.version }}.cdx.json
          asset_content_type: application/json

  # Publish workspace crates to crates.io in dependency order (Milestone 10
  # Epic 3). Gated on the test suite passing and on the release being created.
  # When the workflow is dispatched with `dry_run=true`, this runs
  # `cargo publish --dry-run` for each crate instead of a real publish and does
  # not require the registry token.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test, create-release]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - name: Determine publish mode
        id: mode
        env:
          # Repository secret with crates.io publish scope. Empty if unset.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry-run mode — will run 'cargo publish --dry-run' and NOT publish."
          elif [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — skipping crates.io publish."
          fi

      - name: Publish crates in dependency order
        if: steps.mode.outputs.dry_run != 'skip'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          # Canonical dependency-first publish order (package names):
          #   core -> ports -> leaf tier -> facade.
          CRATES=(
            paladin-ai-core
            paladin-ports
            paladin-battalion
            paladin-llm
            paladin-memory
            paladin-web
            paladin-notifications
            paladin-content
            paladin-storage
            paladin-ai
          )
          publish_one() {
            local crate="$1"
            echo "::group::Publishing ${crate}"
            if [ "$DRY_RUN" = "true" ]; then
              cargo publish --dry-run -p "$crate"
            else
              # Tolerate an already-published version so the job is re-runnable.
              if cargo publish -p "$crate" 2>&1 | tee /tmp/publish.log; then
                echo "${crate} published."
              elif grep -qiE "already (exists|uploaded)|is already uploaded|already published" /tmp/publish.log; then
                echo "::warning::${crate} version already published — continuing."
              else
                echo "::error::Failed to publish ${crate}."
                exit 1
              fi
              # Allow the crates.io index to update before publishing dependents.
              sleep 20
            fi
            echo "::endgroup::"
          }
          for c in "${CRATES[@]}"; do
            publish_one "$c"
          done
