name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      dry_run:
        description: 'Dry run: validate publishing with `cargo publish --dry-run` and do not publish to crates.io'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Release-branch protection (Milestone 10 Epic 5): a release tag must point at
  # a commit that is contained in `main`. This is the authoritative enforcement
  # of the GitFlow "main is the source of truth" invariant — a tag cut from an
  # unmerged feature branch fails here before anything is published.
  verify-tag-source:
    name: Verify Tag From Main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The release commit SHA this job's own `resolve` step already
      # computes, exposed so the consistency gate can check CI's conclusion
      # for the exact release commit rather than re-deriving it.
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Resolve the dispatched tag name to its commit SHA. Force-fetch tags
            # so an annotated tag does not collide with a pre-existing lightweight
            # ref (`would clobber existing tag`).
            git fetch --tags --force --quiet origin
            SHA=$(git rev-list -n 1 -- "$RELEASE_TAG")
          else
            # On a tag push the checked-out commit is already the release commit.
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit: $SHA"

      - name: Ensure release commit is contained in main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          SHA="${{ steps.resolve.outputs.sha }}"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "✅ Release commit $SHA is contained in origin/main."
          else
            echo "::error::Release tag points at commit $SHA, which is NOT contained in main. \
          Release tags must be cut from the main branch (merge via PR first). See \
          docs/src/appendix/branch-protection.md."
            exit 1
          fi

  # Full test suite — gates crates.io publishing (a release must not publish if
  # tests fail). Docker images (build-docker) and release binaries
  # (build-binaries) below are NOT gated on this job -- they depend only on
  # create-release, so a release with a failing test suite can still push a
  # tagged Docker image to ghcr.io and attach binaries to the GitHub release,
  # just not publish to crates.io. This asymmetry is a documented choice
  # (WR-05), not a latent surprise.
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: verify-tag-source
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --workspace

  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: verify-tag-source
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_or_reuse_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        env:
          # Indirect through env: rather than interpolating the tainted
          # output directly into the run: block (CR-01) -- the version
          # ultimately traces back to the workflow_dispatch `tag` input.
          # REGISTRY and IMAGE_NAME are already real shell environment
          # variables here (from the workflow-level env: block), so no
          # further indirection is needed for them.
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Generate changelog from git commits since last tag, written to
          # a file under $RUNNER_TEMP rather than appended to
          # $GITHUB_OUTPUT via a heredoc -- a commit subject line that is
          # exactly the heredoc's own delimiter could otherwise terminate
          # it early and inject arbitrary key=value lines into
          # $GITHUB_OUTPUT. Writing to a file removes that hazard class
          # entirely rather than defending against it, and this is the
          # file the create-or-reuse script's --body-file consumes.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CHANGELOG_FILE="${RUNNER_TEMP}/release-changelog.md"
          {
            echo "## What's Changed"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" HEAD
            else
              git log --pretty=format:"- %s" "$PREV_TAG"..HEAD
            fi
            echo ""
            echo ""
            echo "## Docker Images"
            echo ""
            echo "Multi-architecture Docker images are available:"
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}"
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:latest"
            echo '```'
            echo ""
            echo "Supported platforms:"
            echo "- linux/amd64"
            echo "- linux/arm64"
          } > "$CHANGELOG_FILE"
          echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

      # Create-or-reuse (D-01/D-02/PUBOPS-03): looks the release up by tag
      # first -- HTTP 200 reuses it, HTTP 404 creates it, anything else is a
      # hard failure -- so re-running this job on a tag that already has a
      # release (either GitHub Actions re-run shape) proceeds instead of
      # failing with a 422. No archived or third-party release-creation
      # Action is used; this shells out to the `gh` CLI already
      # authenticated on the runner via GITHUB_TOKEN (D-01 prohibits
      # introducing a new marketplace Action here). Every tag- and
      # SHA-derived value arrives through env: (CR-01) -- never interpolated
      # directly into this run: body -- and the release body is passed as a
      # file path, never as inline commit text.
      - name: Create or reuse release
        id: create_or_reuse_release
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_BODY_FILE: ${{ steps.changelog.outputs.changelog_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/create-or-reuse-release.sh \
            --tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --body-file "$RELEASE_BODY_FILE"

  # Build and push multi-arch Docker images. Intentionally not gated on the
  # `test` job (WR-05) -- see the comment on the `test` job for the tradeoff.
  build-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        run: |
          # Use the exact tag metadata-action produced. It already lowercases the
          # repository name (ghcr requires lowercase, but env.IMAGE_NAME keeps the
          # original `DF3NDR/...` casing) and strips the leading `v` from the
          # semver tag, so reconstructing the reference by hand is error-prone.
          IMAGE=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[0]')
          echo "Inspecting image: $IMAGE"
          docker pull "$IMAGE"
          SIZE=$(docker image inspect "$IMAGE" --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ $SIZE_MB -gt 500 ]; then
            echo "::warning::Image size (${SIZE_MB} MB) exceeds 500 MB target"
          fi

  # Build binaries for multiple platforms. Intentionally not gated on the
  # `test` job (WR-05) -- see the comment on the `test` job for the tradeoff.
  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: paladin-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: paladin-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: paladin-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: paladin-macos-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cross-compilation targets are installed per-toolchain. Installing the
      # target against `stable` while rust-toolchain.toml pins cargo to an exact
      # version would leave the build without a std for the target, so the
      # target must attach to the pinned toolchain.
      #
      # dtolnay/rust-toolchain does NOT read rust-toolchain.toml -- a bare
      # `@master` with no `toolchain:` input fails with "'toolchain' is a
      # required input" before doing any work. Read the pinned channel out of
      # rust-toolchain.toml instead, so there is exactly one source of truth and
      # no fourth place to keep in lockstep.
      - name: Read pinned Rust channel
        id: rust_pin
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          if [ -z "$channel" ]; then
            echo "::error::could not read [toolchain].channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        # Pinned to a commit SHA rather than the mutable `@master` branch ref
        # (WR-02) -- this job holds contents: write. Still the `master` ref's
        # action code (not `@stable`/`@beta`/`@nightly`), which is required
        # for the `toolchain:` input mechanism the comment above depends on;
        # only the ref is pinned, not the toolchain-selection design.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, as of 2026-08-27
        with:
          toolchain: ${{ steps.rust_pin.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked --version 0.2.5

      - name: Build binary
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            # `cross` containers lack a target-arch system OpenSSL, so build a
            # vendored OpenSSL from source for this target only.
            cross build --release --target ${{ matrix.target }} --features vendored-openssl
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            # This binary is cross-compiled to aarch64 (via `cross`), so the host
            # x86_64 `strip` cannot read it ("Unable to recognise the format").
            # Use the matching aarch64 cross strip from binutils-aarch64-linux-gnu.
            sudo apt-get update
            sudo apt-get install -y binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/paladin
          else
            strip target/${{ matrix.target }}/release/paladin
          fi

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact_name }}.tar.gz paladin
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}.tar.gz
          asset_name: ${{ matrix.artifact_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload SHA256
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}.tar.gz.sha256
          asset_name: ${{ matrix.artifact_name }}.tar.gz.sha256
          asset_content_type: text/plain

  # Pre-publish consistency gate (PUBOPS-01): fails closed if the release
  # tag's version disagrees with any publishable crate's manifest version.
  # Runs the exact script `make check-release-consistency` runs locally --
  # no gate logic is duplicated in this YAML (D-07). Added to
  # `publish-crates`'s `needs` below so no `cargo publish` can start before
  # this job has passed. Deliberately NOT added to `create-release`,
  # `build-docker`, `build-binaries` or `sbom` -- WR-05's documented
  # asymmetry (a release with a failing gate can still produce a GitHub
  # release, Docker image, binaries and SBOM; it just cannot publish to
  # crates.io) is preserved deliberately, not by oversight.
  #
  # This job satisfies D-03 by construction: it only reads (cargo metadata
  # over the checked-out tree) and writes nothing, keeping no state between
  # runs. Both "Re-run failed jobs" and "Re-run all jobs" therefore
  # re-evaluate it from scratch and reach the same verdict on the same tag.
  # A future change that introduces caching or a state file here would be a
  # regression against that property.
  check-release-consistency:
    name: Pre-Publish Consistency Gate
    runs-on: ubuntu-latest
    needs: verify-tag-source
    permissions:
      contents: read
      # The CI-conclusion clause queries the Actions workflow-runs API for the
      # tagged SHA; without this the GITHUB_TOKEN gets HTTP 404 (GitHub masks
      # missing scope as not-found) and the gate fails closed with
      # CI_LOOKUP_FAILED. Found live on the v0.8.1-rc.4 rehearsal run
      # (Phase 20, 20-07 finding 5).
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Get version
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pre-publish consistency gate
        env:
          # Indirect through env: rather than interpolating the tainted
          # output directly into the run: block (CR-01) -- the version
          # ultimately traces back to the workflow_dispatch `tag` input.
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
          # The exact release commit SHA verify-tag-source already
          # resolved, so a later clause can check CI's conclusion for the
          # precise release commit rather than re-deriving it.
          RELEASE_SHA: ${{ needs.verify-tag-source.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-release-consistency.sh --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

  # Generate a CycloneDX Software Bill of Materials (SBOM) from the locked
  # dependency graph and attach it to the GitHub release (Milestone 10 Epic 2).
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    env:
      # Indirect through env: rather than interpolating the tainted output
      # directly into run:/with: blocks (CR-01) -- the version ultimately
      # traces back to the workflow_dispatch `tag` input.
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        # cargo-cyclonedx writes one `<crate>.cdx.json` next to each crate's
        # manifest; the root workspace package (paladin-ai) is the primary
        # deliverable for the release.
        run: |
          cargo cyclonedx --all --format json
          # The root package SBOM is the primary deliverable.
          cp paladin-ai.cdx.json "paladin-${RELEASE_VERSION}.cdx.json"

      - name: Upload SBOM to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: paladin-${{ env.RELEASE_VERSION }}.cdx.json
          asset_name: paladin-${{ env.RELEASE_VERSION }}.cdx.json
          asset_content_type: application/json

  # Publish workspace crates to crates.io in dependency order (Milestone 10
  # Epic 3), authenticating via crates.io Trusted Publishing (Phase 19). The
  # job mints a short-lived (~30 minute) publish token per run from its own
  # GitHub OIDC identity via `rust-lang/crates-io-auth-action@v1`; there is no
  # repository secret to be absent, and the action's own post step revokes the
  # token at job end. The job runs only under the `crates-io` GitHub
  # Environment, whose deployment policy admits exclusively `v*.*.*` tags —
  # that environment name is embedded in the OIDC subject claim crates.io
  # validates, so only a release tag from this repository can ever mint a
  # token. When the workflow is dispatched with `dry_run=true`, this runs
  # `cargo publish --dry-run` for each crate instead and mints no token at
  # all. Known accepted risk (T-19-13): a single mint must outlive the whole
  # eleven-crate sequential loop -- that has NOT changed in this revision.
  # What HAS changed (PUBOPS-03/PUBOPS-04, plan 20-05): the loop's waits
  # between crates are now bounded registry polls rather than fixed pauses,
  # and the loop now skips any crate the registry says is already at the
  # tagged version, so a recovery re-run over a partially-published tag is
  # materially shorter than a first run -- it only mints a token for, and
  # publishes, the crates still missing. `publish-crates` also now needs
  # `check-release-consistency` (PUBOPS-01's gate), so no publish can start
  # before the tag, every manifest version, every changelog and the tagged
  # commit's recorded CI conclusion have all been checked to agree. All
  # publish logic (the eleven-crate order, the registry pre-check, the
  # index-visibility poll, the per-crate outcome table, and the
  # no-crate-moved failure) lives in `scripts/publish-crates.sh`, not here --
  # this job is a thin invocation, locally reproducible and unit-tested
  # (`tests/scripts/publish-crates_test.sh`) without touching crates.io.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test, create-release, check-release-consistency]
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine publish mode
        id: mode
        env:
          # Indirect through env: rather than interpolating the dispatch
          # input directly into the run: block (CR-01) -- a workflow_dispatch
          # input is exactly the tainted-value class CR-01 covers.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry-run mode — will run 'cargo publish --dry-run' and NOT publish."
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        id: auth
        if: steps.mode.outputs.dry_run != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      # Delegates the whole loop -- registry pre-check (D-04), bounded
      # index-visibility poll (D-05), per-crate outcome table and the
      # no-crate-moved failure (D-12/PUBOPS-04) -- to
      # scripts/publish-crates.sh. The release version reaches the script
      # through env: (CR-01), never interpolated into this run: body; the
      # eleven-crate dependency order and its paladin-herald placement
      # comment now live once, in the script, not here.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          PUBLISH_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--version "$RELEASE_VERSION")
          if [ "$PUBLISH_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          ./scripts/publish-crates.sh "${ARGS[@]}"
