# Gitleaks configuration for the Paladin workspace.
# Consumed by the gitleaks pre-commit hook (see .pre-commit-config.yaml) and by
# any manual `gitleaks detect` run from the repo root.

title = "Paladin gitleaks configuration"

# Start from the upstream default ruleset and only add allowlists below.
[extend]
useDefault = true

# .claude/gsd-file-manifest.json is generated by the vendored GSD installer
# (`npx @opengsd/gsd-core@latest --claude --local`). It maps each shipped file to
# its SHA-256 integrity digest, e.g.
#   "gsd-core/bin/lib/secrets.cjs": "e4a224058c8f4d744db6f387692a8480..."
# The `generic-api-key` rule fires on the entries whose *filename* contains
# "secret" or "api" next to a high-entropy value. Every value in this file is a
# 64-character hex digest, not a credential.
#
# Deliberately scoped to this single generated file rather than all of .claude/,
# so a real credential committed anywhere else in the tree is still caught.
[allowlist]
description = "GSD file manifest — SHA-256 integrity digests, not credentials"
paths = ['''^\.claude/gsd-file-manifest\.json$''']
