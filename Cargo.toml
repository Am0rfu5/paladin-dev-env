[package]
name = "paladin"
version = "0.1.0"
edition = "2024"
authors = ["Am0rfu5"]
description = "Enterprise AI orchestration framework with multi-agent coordination patterns"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
license = "MIT"
keywords = ["ai", "agents", "orchestration", "llm", "multi-agent"]
categories = ["development-tools", "asynchronous", "api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.12.4", features = ["blocking", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rss = "2.0"
scraper ="0.23.1"
actix-web = "4.0"
structopt = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
dotenv = "0.15.0"
env_logger = "0.11.3"
log = "0.4.21"
config = "0.15.11"
lazy_static = "1.4.0"
tempfile = "3.10.1"
uuid = {version = "1.8.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"]}
url = {version = "2.5.2", features = ["serde"]}
chrono = {version = "0.4.38", features = ["serde"]}
thiserror = "2"
murmur3 = "0.5.2"
fasthash = "0.4.0"
lock_api = "0.4.12"
once_cell = "1.19.0"
regex = "1.11.1"
urlencoding = "2.1.3"
lettre = { version = "0.11.17", features = ["smtp-transport", "pool", "hostname", "builder"] }
handlebars = "6.3.2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "sqlite", "chrono", "uuid", "json"] }
sha2 = "0.10.9"
blake3 = "1.8.2"
tiktoken-rs = "0.6.0"
toml = "0.8.23"
md5 = "0.8.0"
async-trait = "0.1.88"
futures = "0.3.31"
redis = { version = "0.32.2", features = ["aio", "tokio-comp", "connection-manager", "script"], optional = true  }
bytes = "1.10.1"
mime_guess = "2.0.5"
rust-s3 = { version = "0.35.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
testcontainers-modules = { version = "0.12.1", features = ["minio"]}
argon2 = "0.5.3"
axum = "0.8.4"
clap = { version = "4.5.40", features = ["derive"] }
petgraph = "0.6"
rand = "0.8"
colored = "2.1"
comfy-table = "7.1"

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3.0"
testcontainers = "0.24.0"
tokio-test = "0.4"
proptest = "1.4"
serial_test = "3.2.0"
criterion = { version = "0.5", features = ["async_tokio"] }

# Integration test configuration
[[test]]
name = "system_log_integration"
path = "tests/integration/system_log_integration_test.rs"

[[test]]
name = "paladin_garrison_integration"
path = "tests/integration/paladin_garrison_integration_test.rs"

[[test]]
name = "citadel_integration"
path = "tests/integration/citadel_integration_test.rs"

[[bin]]
name = "paladin"
path = "src/main.rs"

[features]
default = ["redis-queue", "s3-storage"]
redis-queue = ["redis"]
s3-storage = ["rust-s3"]

# Performance optimizations for Redis
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 0
debug = true

[[bench]]
name = "battalion_benchmarks"
harness = false

[[bench]]
name = "herald_benchmarks"
harness = false
