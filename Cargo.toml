[package]
name = "paladin"
version = "0.1.0"
edition = "2024"
authors = ["Am0rfu5"]
description = "Enterprise AI orchestration framework with multi-agent coordination patterns"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
license = "MIT"
keywords = ["ai", "agents", "orchestration", "llm", "multi-agent"]
categories = ["development-tools", "asynchronous", "api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.12.4", features = ["blocking", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rss = { version = "2.0", optional = true }
scraper = { version = "0.23.1", optional = true }
actix-web = { version = "4.0", optional = true }
structopt = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
dotenv = "0.15.0"
env_logger = "0.11.3"
log = "0.4.21"
config = "0.15.11"
lazy_static = "1.4.0"
tempfile = "3.10.1"
uuid = {version = "1.8.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"]}
url = {version = "2.5.2", features = ["serde"]}
chrono = {version = "0.4.38", features = ["serde"]}
thiserror = "2"
murmur3 = "0.5.2"
fasthash = "0.4.0"
lock_api = "0.4.12"
once_cell = "1.19.0"
regex = "1.11.1"
urlencoding = "2.1.3"
lettre = { version = "0.11.17", features = ["smtp-transport", "pool", "hostname", "builder"], optional = true }
handlebars = { version = "6.3.2", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "sqlite", "chrono", "uuid", "json"] }
sha2 = "0.10.9"
blake3 = "1.8.2"
tiktoken-rs = { version = "0.6.0", optional = true }
toml = "0.8.23"
md5 = "0.8.0"
async-trait = "0.1.88"
futures = "0.3.31"
redis = { version = "0.32.2", features = ["aio", "tokio-comp", "connection-manager", "script"], optional = true  }
bytes = "1.10.1"
mime_guess = "2.0.5"
rust-s3 = { version = "0.35.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
testcontainers-modules = { version = "0.12.1", features = ["minio"]}
argon2 = "0.5.3"
axum = { version = "0.8.4", optional = true }
clap = { version = "4.5.40", features = ["derive", "cargo", "env"] }
petgraph = "0.6"
rand = "0.8"
colored = "2.1"
comfy-table = "7.1"
serde_yaml = "0.9"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
qdrant-client = { version = "1.14", optional = true }
base64 = "0.22"
pdf-extract = { version = "0.7", optional = true }
# Encryption dependencies for Sentinel Vision System (Epic 13, Task 11.0)
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
tokio-cron-scheduler = "0.13"

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3.0"
testcontainers = "0.24.0"
tokio-test = "0.4"
proptest = "1.4"
serial_test = "3.2.0"
criterion = { version = "0.5", features = ["async_tokio"] }
insta = "1.34"
# Integration test dependencies (gated by integration-tests feature)
wiremock = "0.6"

# Integration test configuration
[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "system_log_integration"
path = "tests/integration/system_log_integration_test.rs"

[[test]]
name = "paladin_garrison_integration"
path = "tests/integration/paladin_garrison_integration_test.rs"

[[test]]
name = "citadel_integration"
path = "tests/integration/citadel_integration_test.rs"

[[test]]
name = "openai_embedding_integration"
path = "tests/integration/openai_embedding_tests.rs"
required-features = ["openai-embeddings"]

[[test]]
name = "in_memory_sanctum_integration"
path = "tests/integration/in_memory_sanctum_tests.rs"

[[test]]
name = "qdrant_sanctum_integration"
path = "tests/integration/qdrant_sanctum_tests.rs"
required-features = ["qdrant"]

[[test]]
name = "rag_integration"
path = "tests/integration/rag_integration_tests.rs"
required-features = ["qdrant"]

[[test]]
name = "vision_integration"
path = "tests/integration/vision_integration_test.rs"
required-features = ["vision", "llm-openai", "llm-anthropic"]

[[test]]
name = "cli"
path = "tests/cli/mod.rs"

[[example]]
name = "vision_analysis"
path = "examples/vision_analysis.rs"
required-features = ["vision", "llm-openai"]

[[example]]
name = "vision_battalion"
path = "examples/vision_battalion.rs"
required-features = ["vision", "llm-openai"]

[[example]]
name = "document_processing"
path = "examples/document_processing.rs"
required-features = ["content-processing"]

[[bin]]
name = "paladin"
path = "src/main.rs"

[[bin]]
name = "paladin-cli"
path = "src/bin/paladin-cli.rs"

[features]
default = ["redis-queue", "s3-storage", "openai-embeddings"]
redis-queue = ["redis"]
s3-storage = ["rust-s3"]
openai-embeddings = []
qdrant = ["qdrant-client"]
integration-tests = []
live-api-tests = []  # Tests requiring real API keys (OpenAI, DeepSeek, Anthropic)

# LLM provider feature flags
llm-openai = []
llm-anthropic = []
llm-deepseek = []
llm-all = ["llm-openai", "llm-anthropic", "llm-deepseek"]
vision = []
content-processing = ["pdf-extract", "scraper", "tiktoken-rs", "rss"]
web-server = ["actix-web", "axum"]
notifications = ["lettre", "handlebars"]

# Performance optimizations for Redis
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 0
debug = true

# Disabled for Docker builds (benches not included in image)
# [[bench]]
# name = "battalion_benchmarks"
# harness = false

# [[bench]]
# name = "herald_benchmarks"
# harness = false

# [[bench]]
# name = "garrison_benchmarks"
# harness = false

[[bench]]
name = "sanctum_benchmarks"
harness = false

# Disabled benchmarks (need API fixes):
