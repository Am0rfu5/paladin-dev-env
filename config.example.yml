# Example Paladin configuration for the HTTP service host (`paladin-server`).
#
# Copy to `config.yml` and edit. API keys are read from the ENVIRONMENT
# (e.g. OPENAI_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY), never from this file.
#
#   cp config.example.yml config.yml
#   OPENAI_API_KEY=sk-... cargo run --bin paladin-server --features web-server

# Top-level LLM fields (legacy; unused by the agent host but required by the schema).
llm_type: "openai"
llm_url: "https://api.openai.com/v1"
llm_api_key: "" # unused — keys come from environment variables

max_file_size: 10485760 # 10 MiB
sources: []

# Address the HTTP server binds to.
server:
  host: "0.0.0.0"
  port: 3000

# Execution timeout policy (seconds). Applied to /execute, /execute/stream, and /jobs.
# Resolution order: per-request timeout_seconds -> per-agent timeout_seconds -> default,
# clamped to `max`.
timeouts:
  default_seconds: 300
  max_seconds: 600

# Cross-cutting HTTP layers (Epic 4). All optional with safe defaults.
http:
  # Allowed CORS origins; omit or leave empty for permissive (dev only).
  cors_allow_origins: []
  # Reject request bodies larger than this many bytes (413).
  body_limit_bytes: 1048576 # 1 MiB
  # Coarse outer timeout (seconds) for non-streaming routes; 0 disables it.
  # (Streaming is bounded by `timeouts` above, never by this.)
  global_timeout_seconds: 0
  # Per-client (IP) rate limiting; off by default.
  rate_limit:
    enabled: false
    per_second: 10
    burst: 20

# Agents served behind the HTTP API. Each becomes resident at /agents/<id>:
#   POST /agents/<id>/execute          — buffered run
#   POST /agents/<id>/execute/stream   — token streaming (SSE)
#   POST /agents/<id>/jobs             — async run (poll GET /agents/<id>/jobs/<job_id>)
agents:
  - id: "researcher"
    provider: "openai" # optional; defaults to llm.default_provider
    model: "gpt-4"
    system_prompt: "You research topics thoroughly."
    temperature: 0.7 # optional
    timeout_seconds: 120 # optional per-agent override (clamped to timeouts.max_seconds)
  - id: "summarizer"
    model: "gpt-4"
    system_prompt: "You write concise summaries."
