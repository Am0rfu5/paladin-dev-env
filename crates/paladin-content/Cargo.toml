[package]
name = "paladin-content"
version = "0.1.0"
edition = "2024"
description = "Content processing adapters and use-case services for the Paladin framework"
license = "MIT"
repository = "https://github.com/DF3NDR/paladin-dev-env"

[lib]
doctest = false

[features]
pdf          = []
web-scraping = ["dep:scraper"]
rss          = ["dep:rss"]
news-api     = []
tiktoken     = ["dep:tiktoken-rs"]
llm          = ["dep:paladin-llm"]

[dependencies]
paladin-core  = { workspace = true }
paladin-ports = { workspace = true }
paladin-llm   = { workspace = true, optional = true }
async-trait   = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
uuid          = { workspace = true }
reqwest       = { workspace = true, features = ["blocking"] }
regex         = { workspace = true }
url           = { version = "2.5.2", features = ["serde"] }
urlencoding   = "2.1.3"
pdf-extract   = { version = "0.7" }
scraper       = { version = "0.23.1", optional = true }
rss           = { version = "2.0", optional = true }
tiktoken-rs   = { version = "0.6.0", optional = true }
