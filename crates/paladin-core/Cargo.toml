[package]
name = "paladin-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pure domain types for the Paladin framework — zero infrastructure dependencies"
repository = "https://github.com/DF3NDR/paladin-dev-env"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
sha2 = "0.10.9"
blake3 = "1.8.2"
petgraph = "0.6"
fasthash = "0.4.0"
url = { version = "2.5.2", features = ["serde"] }
regex = "1.11.1"
futures = "0.3.31"
