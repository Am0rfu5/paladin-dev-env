[package]
name = "paladin-herald"
version = "0.7.0"
edition = "2024"
authors = ["Am0rfu5"]
license = "MIT"
description = "Herald output-formatter adapters for the Paladin framework (JSON, Markdown, Table)"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "herald", "formatting", "output", "cli"]
categories = ["development-tools", "command-line-interface"]
documentation = "https://docs.rs/paladin-herald"

[lib]
doctest = false

[dependencies]
paladin-core = { package = "paladin-ai-core", version = "0.7.0", path = "../paladin-core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
comfy-table = "7.1"
colored = "2.1"

[dev-dependencies]
paladin-ports = { version = "0.7.0", path = "../paladin-ports" }
uuid = { workspace = true }
