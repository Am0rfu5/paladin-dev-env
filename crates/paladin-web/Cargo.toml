[package]
name = "paladin-web"
version = "0.5.1"
edition = "2024"
authors = ["Am0rfu5"]
description = "Web server adapters for the Paladin AI orchestration framework (axum)"
readme = "README.md"
license = "MIT"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "web", "axum", "http", "orchestration"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-web"

[dependencies]
paladin-ports = { version = "0.5.1", path = "../paladin-ports" }
paladin-core = { package = "paladin-ai-core", version = "0.5.1", path = "../paladin-core" }
axum = { version = "0.8.4" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
log = { workspace = true }
async-trait = { workspace = true }
# Streaming (SSE): adapt the agent PaladinStream (mpsc receiver) into an axum SSE body.
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
mockito = "1.7.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
