[book]
authors = ["Paladin Framework Contributors"]
language = "en"
multilingual = false
src = "src"
title = "Paladin Framework"
description = "Enterprise multi-agent orchestration framework in Rust"

[output.html]
git-repository-url = "https://github.com/DF3NDR/paladin-dev-env"
edit-url-template = "https://github.com/DF3NDR/paladin-dev-env/edit/main/docs/src/{path}"
site-url = "/paladin-dev-env/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.links]

# [output.linkcheck] is disabled for Epic 2.
# 227 pre-existing broken internal cross-references exist in migrated content
# (identified in Epic 1 audit — stale links to old flat-file paths like QUICKSTART.md).
# Re-enable after Epic 3 content cleanup with the following config:
#   [output.linkcheck]
#   follow-web-links = false
#   warning-policy = "error"
