# Basic Paladin Configuration Example
# For use with: paladin agent run -c basic_paladin.yaml

# Paladin identity
name: "BasicPaladin"
user_name: "User"

# System prompt defines the Paladin's behavior and capabilities
system_prompt: |
  You are a helpful AI assistant that can answer questions and help with tasks.
  Be concise and clear in your responses.
  When asked to perform a task, break it down into steps and execute them.

# LLM Configuration
model: "gpt-4"
temperature: 0.7
max_loops: 3
timeout_seconds: 300
stop_words: ["TERMINATE", "STOP"]

# Provider Configuration (API keys loaded from environment variables)
provider:
  type: openai
  # OPENAI_API_KEY must be set in environment

# Optional: Memory system (uncomment to enable)
