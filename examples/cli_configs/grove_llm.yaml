# ============================================================================
# USAGE EXAMPLES
# ============================================================================
#
# Complex multi-domain task (LLM analyzes and routes intelligently):
# cargo run -- battalion run -c examples/cli_configs/grove_llm.yaml \
#   -i "We need to reduce API latency - users complain about slow dashboard loads. \
#       The bottleneck seems to be in data fetching but I'm not sure if it's \
#       database queries, API design, or frontend rendering."
# → LLM analyzes: identifies database + frontend aspects
# → Routes to DatabaseArchitect (primary bottleneck likely in queries)
# → Confidence: 78%
#
# Nuanced technical decision:
# cargo run -- battalion run -c examples/cli_configs/grove_llm.yaml \
#   -i "Should we use GraphQL or REST for our new mobile API? \
#       We have 3 mobile clients, need real-time updates, and want \
#       to minimize over-fetching."
# → LLM analyzes: API design decision with specific requirements
# → Routes to ApiArchitect (best equipped for protocol selection)
# → Provides reasoning for choice
#
# Infrastructure + deployment task:
# cargo run -- battalion run -c examples/cli_configs/grove_llm.yaml \
#   -i "Set up monitoring for our Kubernetes cluster with alerting \
#       for pod crashes, high CPU usage, and request latency spikes"
# → LLM analyzes: observability + Kubernetes
# → Routes to SreObservabilityExpert (monitoring focus)
# → Confidence: 85%
#
# ============================================================================
# ROUTING BEHAVIOR
# ============================================================================
#
# LlmRouting Algorithm:
# 1. LLM receives task description and all agent descriptions
# 2. LLM analyzes task requirements, complexity, and domain
# 3. LLM considers each agent's strengths and suitability
# 4. LLM selects best agent with confidence score and reasoning
# 5. If confidence below threshold, routes to fallback
#
# Example LLM Reasoning:
# Task: "Users see stale data after making updates"
#
# LLM Analysis:
# - Could be frontend state management issue (React state not updating)
# - Could be backend caching issue (stale cache entries)
# - Could be database replication lag (read replicas out of sync)
# - Context suggests UI problem ("users see" indicates visual issue)
#
# Decision: ReactSpecialist
# Confidence: 72%
# Reasoning: "The phrase 'users see' suggests a UI state management issue.
#             Likely React state not reflecting backend updates. Start with
#             frontend state management before investigating backend."
#
# ============================================================================
# ADVANTAGES OF LLM ROUTING
# ============================================================================
#
# ✓ INTELLIGENT: Deep understanding of task requirements
# ✓ CONTEXTUAL: Considers multiple factors simultaneously
# ✓ EXPLAINABLE: Provides reasoning for routing decision
# ✓ ADAPTIVE: Handles novel or complex scenarios
# ✓ NUANCED: Understands subtle distinctions between agents
# ✓ MULTI-FACTOR: Balances domain, complexity, and requirements
#
# Requirements:
# • LLM service (OpenAI, Anthropic, DeepSeek, etc.)
# • Rich agent descriptions for informed decisions
# • ~200-500ms additional latency per routing
# • Higher cost (~$0.001-0.005 per routing with GPT-4)
#
# Best for: Complex, ambiguous tasks requiring intelligent analysis
#
# ============================================================================
# ROUTING STRATEGY COMPARISON
# ============================================================================
#
# When to use each strategy:
#
# KeywordMatch:
# ✓ Clear, well-defined domains
# ✓ Speed critical (< 10ms routing)
# ✓ Zero additional cost
# ✓ Simple deployment (no external services)
#
# SemanticSimilarity:
# ✓ Natural language queries
# ✓ Paraphrasing and synonyms
# ✓ Balanced speed/accuracy (~50-100ms)
# ✓ Lower cost (~$0.0001 per routing)
#
# LlmRouting:
# ✓ Complex, multi-faceted tasks
# ✓ Ambiguous requirements
# ✓ Need for explainability
# ✓ Critical decision quality
# ✓ Acceptable latency (~200-500ms)
#
# ============================================================================
