# ============================================================================
# GROVE BATTALION CONFIGURATION - LLM ROUTING
# ============================================================================
# Intelligent agent routing using LLM reasoning.
# Perfect for complex tasks requiring deep understanding and multi-factor analysis.
#
# For use with: paladin battalion run -c grove_llm.yaml -i "Task description"
#
# Pattern: LLM analyzes task and selects best agent with reasoning
# ============================================================================

# ============================================================================
# BATTALION TYPE
# ============================================================================

# Grove: Intelligent routing pattern with LLM-powered decision making
# - LLM analyzes task context and requirements
# - Considers multiple factors for optimal routing
# - Provides explainable routing decisions
type: grove

# Battalion identifier
name: "LlmRoutedGrove"

# ============================================================================
# GROVE CONFIGURATION
# ============================================================================

config:
  # LlmRouting: Most intelligent routing strategy
  # Requires: LLM service (OpenAI, Anthropic, DeepSeek, etc.)
  routing_strategy: LlmRouting

  # LLM configuration for routing decisions
  llm_routing:
    # Provider for routing LLM
    provider: openai
    # Model for routing decisions (gpt-4o for best results, gpt-4o-mini for cost)
    model: "gpt-4o"
    # Temperature for routing (lower = more deterministic)
    temperature: 0.3
    # Max tokens for routing response
    max_tokens: 500

  # Fallback tree when LLM can't decide or low confidence
  fallback_tree: "UniversalSupportTree"

  # Confidence threshold for routing (0.0-1.0)
  # LLM must express confidence above this threshold
  similarity_threshold: 0.65  # 65% confidence required

# ============================================================================
# EXPERT TREES
# ============================================================================
# For LLM routing, agent descriptions are critical - they inform the LLM's decision

trees:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # TREE 1: BACKEND ARCHITECTURE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - name: "BackendArchitecture"
    agents:
      # Agent 1: Database Architect
      - inline:
          name: "DatabaseArchitect"

          # Rich description helps LLM make informed routing decisions
          agent_description: |
            Expert database architect specializing in:
            - Schema design and normalization (1NF through BCNF)
            - SQL and NoSQL database selection and optimization
            - Query performance tuning and indexing strategies
            - Database scaling (sharding, replication, partitioning)
            - Data modeling for various use cases (OLTP, OLAP, time-series)
            - Migration strategies and zero-downtime deployments

            Best suited for tasks involving:
            • Database schema design or refactoring
            • Query optimization and performance issues
            • Data modeling and relationship design
            • Database technology selection
            • Scaling database infrastructure
            • Data migration planning

          expertise_keywords:
            - database
            - schema
            - query
            - sql
            - nosql
            - optimization

          system_prompt: |
            You are an expert database architect.

            When assigned a task:
            1. Analyze data requirements and access patterns
            2. Design optimal schema structures
            3. Recommend appropriate database technologies
            4. Specify indexing and optimization strategies
            5. Consider scalability and performance
            6. Provide complete DDL/migrations

            Deliver production-ready database solutions with clear rationale.

          model: "gpt-4o"
          temperature: 0.7
          max_loops: 2
          timeout_seconds: 240
          stop_words: []

          provider:
            type: openai

      # Agent 2: API Architect
      - inline:
          name: "ApiArchitect"

          agent_description: |
            Expert API architect specializing in:
            - RESTful API design following OpenAPI standards
            - GraphQL schema design and optimization
            - gRPC service definitions for high-performance APIs
            - API versioning and backwards compatibility
            - Authentication/authorization (OAuth 2.0, JWT, API keys)
            - Rate limiting, throttling, and quota management

            Best suited for tasks involving:
            • API design and endpoint structure
            • Request/response format definition
            • API security and authentication
            • API documentation and contracts
            • Protocol selection (REST vs GraphQL vs gRPC)
            • API gateway and integration patterns

          expertise_keywords:
            - api
            - rest
            - graphql
            - endpoint
            - authentication
            - integration

          system_prompt: |
            You are an expert API architect.

            When assigned a task:
            1. Design clean, intuitive API interfaces
            2. Specify complete request/response formats
            3. Address authentication and authorization
            4. Document endpoints thoroughly (OpenAPI)
            5. Consider developer experience
            6. Plan for versioning and evolution

            Create APIs that are secure, scalable, and delightful to use.

          model: "gpt-4o"
          temperature: 0.7
          max_loops: 2
          timeout_seconds: 240
          stop_words: []

          provider:
            type: openai

      # Agent 3: Distributed Systems Expert
      - inline:
          name: "DistributedSystemsExpert"

          agent_description: |
            Expert in distributed systems and microservices architecture:
            - Microservices decomposition and boundaries
            - Service communication patterns (sync/async, event-driven)
            - Distributed transactions and consistency (Saga, 2PC)
            - Service mesh and observability (Istio, Linkerd)
            - Resilience patterns (circuit breaker, retry, timeout, bulkhead)
            - Event sourcing and CQRS

            Best suited for tasks involving:
            • Microservices architecture design
            • Service boundary definition
            • Inter-service communication
            • Distributed transaction handling
            • System resilience and fault tolerance
            • Event-driven architecture

          expertise_keywords:
            - microservices
            - distributed
            - eventdriven
            - messaging
            - resilience
            - saga

          system_prompt: |
            You are an expert in distributed systems.

            When assigned a task:
            1. Design service boundaries and responsibilities
            2. Specify communication patterns
            3. Address consistency and transaction requirements
            4. Recommend resilience strategies
            5. Consider observability and debugging
            6. Plan for failure scenarios

            Build resilient, scalable distributed architectures.

          model: "gpt-4o"
          temperature: 0.7
          max_loops: 2
          timeout_seconds: 240
          stop_words: []

          provider:
            type: openai

