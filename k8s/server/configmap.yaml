# Configuration for the paladin-server HTTP API.
#
# Secrets (LLM + API keys) are NOT here — they come from the Secret (see secret.yaml.example)
# and are referenced as ${ENV_VAR}, expanded by the server at load time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paladin-server-config
  namespace: paladin
  labels:
    app: paladin-server
data:
  config.yml: |
    llm_type: "openai"
    llm_url: "https://api.openai.com/v1"
    llm_api_key: "${OPENAI_API_KEY}"
    max_file_size: 10485760
    sources: []

    server:
      host: "0.0.0.0"
      port: 8080

    timeouts:
      default_seconds: 300
      max_seconds: 600

    http:
      # Enabled by default and fail-closed: the keys below come from the Secret.
      auth:
        enabled: true
        api_keys:
          - key: "${PALADIN_API_KEY_CI}"
            name: "ci-runner"
            role: "admin"
          - key: "${PALADIN_API_KEY_APP}"
            name: "frontend"
            role: "user"
        bearer_token:
          enabled: false
      # Serve the OpenAPI spec + Swagger UI (set false to disable in production).
      docs:
        enabled: true

    agents:
      - id: "researcher"
        provider: "openai"
        model: "gpt-4"
        system_prompt: "You research topics thoroughly."
        allowed_roles: ["admin", "user"]
