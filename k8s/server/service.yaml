# Service fronting the paladin-server pods.
apiVersion: v1
kind: Service
metadata:
  name: paladin-server
  namespace: paladin
  labels:
    app: paladin-server
spec:
  type: ClusterIP # Change to LoadBalancer for external access (or front with an Ingress).
  selector:
    app: paladin-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
