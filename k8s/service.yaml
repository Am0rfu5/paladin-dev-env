apiVersion: v1
kind: Service
metadata:
  name: paladin
  namespace: paladin
  labels:
    app: paladin
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For AWS
spec:
  type: ClusterIP  # Change to LoadBalancer for external access
  selector:
    app: paladin
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: paladin-headless
  namespace: paladin
  labels:
    app: paladin
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for direct pod access
  selector:
    app: paladin
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# Metrics service for Prometheus scraping
apiVersion: v1
kind: Service
metadata:
  name: paladin-metrics
  namespace: paladin
  labels:
    app: paladin
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: paladin
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
